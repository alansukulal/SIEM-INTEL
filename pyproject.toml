[project]
name = "siem-intel"
version = "0.1.0"
description = "Agentic SIEM investigation and automation platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langchain-core",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "azure-identity",
    "azure-monitor-query",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88